<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de 3 Fotos</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px;
            margin: 0;
        }
        h1 {
            color: #ff4757;
        }
        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .foto-card {
            background-color: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .foto-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Mi Galería de Fotos</h1>
    <p>Bienvenido a mi primera página web.</p>

    <div class="galeria">
        <div class="foto-card">
            <img src="https://via.placeholder.com/250" alt="Foto 1">
            <p>Foto 1</p>
        </div>
        <div class="foto-card">
            <img src="https://via.placeholder.com/250" alt="Foto 2">
            <p>Foto 2</p>
        </div>
        <div class="foto-card">
            <img src="https://via.placeholder.com/250" alt="Foto 3">
            <p>Foto 3</p>
        </div>
    </div>
</body>
</html>
