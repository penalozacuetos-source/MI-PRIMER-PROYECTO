<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de 3 Fotos</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px;
            margin: 0;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 30px;
        }
        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .galeria img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .galeria img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>Mi Galería de 3 Fotos</h1>
    <div class="galeria">
        <img src="https://picsum.photos/id/1015/300/200" alt="Foto 1">
        <img src="https://picsum.photos/id/1018/300/200" alt="Foto 2">
        <img src="https://picsum.photos/id/1025/300/200" alt="Foto 3">
    </div>
</body>
</html>
