<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de 3 Fotos</title>
    <style>
        body {
            background-color: #0b0b16;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px;
            margin: 0;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 71, 87, 0.4);
        }
        p {
            color: #a4b0be;
            margin-bottom: 30px;
        }
        .contenedor-fotos {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .tarjeta-foto {
            background: #1e1e2f;
            border: 2px solid #2d1b4e;
            border-radius: 15px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .tarjeta-foto:hover {
            border-color: #ff4757;
            transform: translateY(-5px);
        }
        .tarjeta-foto img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
        .tarjeta-foto h3 {
            color: #ffffff;
            font-size: 16px;
            margin: 15px 0 5px 0;
        }
    </style>
</head>
<body>

    <h1>Mi Proyecto con Mis Fotos</h1>
    <p>Una pequeña muestra organizada en GitHub.</p>

    <div class="contenedor-fotos">
        <!-- FOTO 1 -->
        <div class="tarjeta-foto">
            <img src="foto1.jpg" alt="Foto 1">
            <h3>Foto 1</h3>
        </div>

        <!-- FOTO 2 -->
        <div class="tarjeta-foto">
            <img src="foto2.jpg" alt="Foto 2">
            <h3>Foto 2</h3>
        </div>

        <!-- FOTO 3 -->
        <div class="tarjeta-foto">
            <img src="foto3.jpg" alt="Foto 3">
            <h3>Foto 3</h3>
        </div>
    </div>

</body>
</html>
